<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pdf Viewer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>PDF Summarizer</h1>
        <p>Check out your PDF files here, in a few sentences only !</p>
    </header>

    <!-- Upload section with Choose PDF button, name of the file and clear button -->
    <div class="uploadSection">
        <label for="pdfInput" class="uploadBtn">Choose a PDF</label>
        <input type="file" id="pdfInput" accept="application/pdf" hidden>
        <p id="fileName">No file chosen</p>
        <button id="clearBtn" style="display:none;">Clear</button>
    </div>

    <!-- Where the PDF appears/is framed in the browser -->
    <iframe id="pdfFrame" style="display:none;"></iframe>

    <!-- Where the AI summary shows up -->
    <div id="summaryOutput">No content yet</div>

    <!-- Import script.js and PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
